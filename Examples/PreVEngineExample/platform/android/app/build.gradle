apply plugin: 'com.android.application'

android {
    ndkVersion '27.2.12479018'
    signingConfigs {
        debug {
            // Default debug keystore (automatically created by Android)
        }
        release {
            storeFile file('/home/lubos/Documents/Vulkan/prev.keystore')
            storePassword 'prev'
            keyAlias = 'prev'
            keyPassword 'prev'
        }
    }
    compileSdkVersion 35

    defaultConfig {
        applicationId = 'com.prevengine.PreVEngineExample'
        minSdkVersion 24
        targetSdkVersion 35
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                targets "PreVEngineExample" // build/package only this app's native lib (top-level CMake has others)
                abiFilters "arm64-v8a"/*, "x86", "x86_64"*/
                arguments '-DANDROID_STL=c++_static',
                          '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                if (project.hasProperty('enableXr')) {
                    arguments '-DENABLE_OPENXR=ON'
                    // -PnoMultiview => OpenXR per-eye (single-view shaders, one pass per eye) instead of
                    // the default single-pass multiview.
                    if (project.hasProperty('noMultiview')) {
                        arguments '-DENABLE_MULTIVIEW=OFF'
                    }
                }
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake {
            version '3.22.1'
            path '../../../../../CMakeLists.txt'
        }
    }
    sourceSets {
        main {
            assets.srcDirs = ['../../../assets']
        }
    }
    namespace 'com.prevengine.PreVEngineExample'
    
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

//    // Enable prefab support for the OpenXR AAR
//    buildFeatures {
//        prefab true
//    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
//    implementation 'org.khronos.openxr:openxr_loader_for_android:1.0.34'

}

// Shaders are (re)compiled into the source assets tree by the CMake native build (compile_shaders.py),
// but AGP's merge*Assets snapshots those assets BEFORE buildCMake* runs. So the first build after a
// shader-config change (e.g. flipping -PnoMultiview) would package the PREVIOUS build's shaders. Force
// each variant's asset merge to run after its OWN native build so it always picks up the freshly compiled
// shaders. Scoped per variant so a debug build doesn't drag in the release native build (or vice versa);
// AGP maps the release variant to the "RelWithDebInfo" CMake build type, others to a same-named type.
afterEvaluate {
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach { mergeTask ->
        def variant = mergeTask.name - 'merge' - 'Assets'                  // "Debug" / "Release"
        def cmakeType = (variant == 'Release') ? 'RelWithDebInfo' : variant
        mergeTask.dependsOn(tasks.matching { it.name.startsWith("buildCMake${cmakeType}") })
    }
}
